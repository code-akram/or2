# Release binaries of the or2-pair host CLI (see docs/build.md, "or2-pair release binaries").
#
# A tag or2-pair-v<version> (the workspace version in core/Cargo.toml) builds static Linux
# binaries (x86_64, aarch64) and macOS binaries (Intel, Apple silicon) with `cargo xtask dist`,
# and publishes them with one SHA256SUMS as the GitHub release of that tag, which
# scripts/install-or2-pair.sh installs from. A manual run builds the same binaries as workflow
# artifacts and publishes nothing, unless it is run on such a tag.

name: or2-pair release

on:
  push:
    tags:
      - "or2-pair-v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: or2-pair-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: "1.98.1"
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        include:
          # Static musl binaries linked with rust-lld; the x86_64 one is run once.
          - os: linux
            runner: ubuntu-24.04
            targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
          # Apple silicon runner; Apple's toolchain links the Intel binary too.
          - os: macos
            runner: macos-15
            targets: x86_64-apple-darwin,aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUSTUP_TOOLCHAIN }}
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target "${{ matrix.targets }}"

      - name: Build with cargo xtask dist
        shell: bash
        run: |
          set -euo pipefail
          set --
          if [[ "$GITHUB_REF" == refs/tags/or2-pair-v* ]]; then
            # The tag must name the version being built.
            set -- --expect-version "${GITHUB_REF_NAME#or2-pair-v}"
          fi
          cargo run --quiet --locked --manifest-path core/Cargo.toml -p xtask -- dist --out dist "$@"
          file dist/or2-pair-*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: or2-pair-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish the GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/or2-pair-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: or2-pair-*
          path: artifacts

      - name: Join the checksums and check every binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cp artifacts/*/or2-pair-* release/
          cat artifacts/*/SHA256SUMS | sort -k 2 > release/SHA256SUMS
          cd release
          sha256sum --check --strict SHA256SUMS
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin; do
            grep -q "  or2-pair-$target\$" SHA256SUMS || { echo "missing or2-pair-$target"; exit 1; }
          done
          files=(*)
          test "${#files[@]}" -eq 5
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#or2-pair-v}"
          cat > notes.md <<EOF
          or2-pair $version: the host side of or2's Easy pair.

          Install (Linux x86_64/aarch64, static; macOS Intel/Apple silicon), into ~/.local/bin, checksum verified:

              curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/install-or2-pair.sh | sh

          Or download the binary for your host and check it against SHA256SUMS: \`grep ' or2-pair-<target>\$' SHA256SUMS | sha256sum -c\` (on macOS \`shasum -a 256 -c\`).
          EOF
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "or2-pair $version" \
            --notes-file notes.md
