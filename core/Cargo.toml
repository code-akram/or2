[workspace]
members = ["or2-core", "or2-ffi"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "8953a740bc378cec3e07e1f6ca949f0595eab19b", default-features = false }
or2-core = { path = "or2-core" }
rand = { version = "=0.10.3", features = ["thread_rng"] }
russh = "=0.63.3"
serde_json = "=1.0.151"
thiserror = "=2.0.21"
tokio = "=1.47.1"
uniffi = "=0.32.2"
zeroize = "=1.9.0"
