[package]
name = "or2-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `LocalHost`: a `RemoteHost` over local processes and Unix sockets, for tests only.
test-support = []

[dependencies]
libghostty-vt.workspace = true
rand.workspace = true
russh.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
zeroize.workspace = true

[dev-dependencies]
or2-core = { path = ".", features = ["test-support"] }
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync"] }
